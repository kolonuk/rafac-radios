<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Teaching App</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Radio Teaching App</h1>
        <div id="error-message" class="error"></div>

        <div class="forms-container">
            <div class="form-box">
                <h2>Student Join</h2>
                <form action="/student" method="get">
                    <label for="name">Your Name:</label>
                    <input type="text" id="name" name="name" required>
                    <label for="lessonID_student">Lesson ID:</label>
                    <input type="text" id="lessonID_student" name="lessonID" required>
                    <button type="submit">Continue</button>
                </form>
            </div>

            <div class="form-box">
                <h2>Tutor Login</h2>
                <form action="/tutor" method="get">
                    <label for="tutorID">Tutor ID:</label>
                    <input type="password" id="tutorID" name="tutorID" required>
                    <label for="lessonID_tutor">Lesson ID:</label>
                    <input type="text" id="lessonID_tutor" name="lessonID" required>
                    <button type="submit">Continue</button>
                </form>
            </div>
        </div>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        if (error) {
            document.getElementById('error-message').textContent = error;
        }
    </script>
</body>
</html>
