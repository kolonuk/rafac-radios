<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student View - {{.Name}}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body id="student-body">
    <div class="student-container">
        <h1>Welcome, <span id="student-name">{{.Name}}</span></h1>
        <p>Lesson ID: <strong>{{.LessonID}}</strong> | Tutor: <strong id="tutor-name-display">{{.TutorName}}</strong></p>

        <div class="callsign-display">
            Your Callsign: <span id="current-callsign">None</span>
            <button id="change-call-btn" class="mini-btn" style="display:none;">Change</button>
        </div>

        <div class="frequency-display">
            Current Frequency: <span id="current-frequency">None</span>
            <button id="change-freq-btn" class="mini-btn" style="display:none;">Change</button>
        </div>

        <div class="others-list">
            <strong>Frequencies:</strong>
            <ul id="freq-status-list">
                <!-- Frequencies with status colors -->
            </ul>
            <br>
            <strong>Others on your frequency:</strong>
            <ul id="others-on-freq">
                <!-- Others will appear here -->
            </ul>
        </div>

        <div class="ptt-container">
            <button id="ptt-button">PUSH TO TALK (PTT)</button>
            <p class="hint">Push and hold the button or Space bar</p>
        </div>

        <div class="permissions">
            <button id="request-permissions-student">Allow Mic/Speaker</button>
            <span id="permission-status-student"></span>
        </div>

        <a href="/" class="button leave-btn">Leave</a>
    </div>

    <dialog id="student-freq-dialog">
        <form method="dialog">
            <h3>Join Frequency</h3>
            <div id="freq-options" class="frequency-grid"></div>
            <div id="open-freq-input" style="display:none; margin-top:1rem;">
                <input type="text" id="custom-freq-name" placeholder="New frequency name">
                <button id="create-custom-freq">Create & Join</button>
            </div>
            <div class="dialog-buttons">
                <button value="cancel">Cancel</button>
            </div>
        </form>
    </dialog>

    <dialog id="student-callsign-dialog">
        <form method="dialog">
            <h3>Change Callsign</h3>
            <input type="text" id="new-callsign-input" placeholder="Enter new callsign">
            <div class="dialog-buttons">
                <button value="cancel">Cancel</button>
                <button id="confirm-call-change" value="default">Request Change</button>
            </div>
        </form>
    </dialog>

    <script src="/static/app.js"></script>
    <script>
        initStudent("{{.LessonID}}", "{{.Name}}");
    </script>
</body>
</html>
